# Browser automation configuration for onshape_browser_mode.
#
# Committed defaults only. Machine-local overrides belong in
# `onshape_browser_mode/config/browser.local.toml` (gitignored). The browser layer is an OPTIONAL
# dependency: the MCP server still runs without Playwright installed; browser_*
# tools report a clear setup error instead.

[browser]
channel = "msedge"    # use the machine's existing Edge; no browser download
executable_path = ""                  # optional exact binary path; overrides `channel`
user_data_dir = "user_data/onshape_profile"  # persistent login profile, checkout-local
# Isolation (issue #7): point this at a SEPARATE profile directory to run the
# automation outside the persistent login profile. The launched browser is a real
# Edge channel, and on a machine whose Windows account is a Microsoft account Edge
# signs a fresh profile in automatically, so the window is NOT anonymous by default.
# Onshape login persistence is bought with a persistent profile, so this is a
# trade-off, not a fix: a separate directory means a fresh (or explicitly isolated)
# browser identity and, unless it is also persistent, another human sign-in.
# This is ONLY a directory choice. Guest mode (`--guest`) is deliberately NOT
# implemented and must not be inferred from this key.
isolated_user_data_dir = ""
locale = "zh-CN"
timezone = "Asia/Shanghai"
headless = false              # ALWAYS false; human watches and completes login/captcha
proxy_server = ""                     # optional HTTP proxy, e.g. "http://127.0.0.1:10808"; empty = none

# Resident mode: keep ONE browser alive across MCP child processes so the Onshape
# login survives a bridge restart. Onshape auth cookies are session cookies, so a
# browser death costs a human SSO/2FA login every time. When enabled, the module
# spawns a detached browser with a loopback-only DevTools endpoint and every child
# merely attaches to it. ON by default since 2026-09-26 (owner decision): the
# alternative costs a human sign-in on every child restart. Opt out per deployment
# with `resident = false` in the gitignored browser.local.toml.
resident = true
resident_port = 9333                  # 127.0.0.1 only; one port per profile/host

[pacing]
min_delay_s = 0.8                     # randomized delay slept before each real action (click/scroll/eval)
max_delay_s = 2.0
max_actions_per_minute = 8            # hard per-process cap on real browser actions per minute

[listener]
enabled = true                        # browser_watch / dev probes may record sessions
record_dom_snippets = true            # keep only a short text snippet around a clicked element
record_network = true                 # record URL pattern / method / status / top-level JSON keys
snippet_max_chars = 240               # max characters kept per DOM snippet (redaction happens upstream)
default_watch_seconds = 180           # default recording window for browser_watch
output_dir = "./dev/watch-sessions"   # relative to the repository root
